<!DOCTYPE html>

<body>
  <div class="ambient ambient-one"></div>

        <nav class="header-shortcuts" aria-label="Quick modules"></nav>

      <section class="feature-shell glass-card" data-reveal>

          <p class="status-line"><span class="status-dot"></span> QR engine ready</p>
          <h2>All-in-One QR Code Generator</h2>
          <p class="subtitle">Create stylish, scannable QR codes for any use case — with logos, gradients, and design templates.</p>
        </div>
        <div id="qr-generator-module" class="module-root"></div>
      </section>
    </main>
  </div>
